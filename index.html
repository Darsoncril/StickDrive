<style>

#start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,14,24,.88);text-align:center;gap:12px;cursor:pointer;padding:24px}

.mm{display:flex;flex-direction:column;gap:12px;width:min(320px,80%)}

#mpP{display:none}#mCode{width:100%;box-sizing:border-box;padding:12px;font-size:20px;text-align:center;letter-spacing:6px;text-transform:uppercase;border-radius:12px;border:1px solid #fff5;background:rgba(0,0,0,.4);color:#fff;touch-action:auto;user-select:text;-webkit-user-select:text}

#pp{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(5,8,16,.92)}

#psg.draw{animation:sg .9s linear}
@keyframes sg{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}

#pb{padding:10px;font-size:17px}

</style></head><body>
<div id="stage"><div id="ui"><div class="p">🚗 <span id="kmh">0</span> км/ч</div><div class="p"><button id="bc">💬 Болтать</button><button id="bo">🪟 Выглянуть</button><button id="bl">👀 Назад</button><button id="bd">🚗 Управлять</button><button id="bm">☰ Меню</button></div></div>
<div id="toast"></div><div id="bub"></div><div id="chat"><input id="ci" maxlength="200" placeholder="Скажи что-нибудь соседу…" autocomplete="off"><button id="cs">➤</button></div><div id="rm" class="p" style="display:none"></div><div id="pd"><div class="pd l"><button data-k="L">◀</button><button data-k="R">▶</button></div><div class="pd r"><button data-k="Br">🛑</button><button data-k="G">⛽</button></div></div><input type="file" id="fm" accept="audio/*" multiple hidden>
<div id="pp"><div class="pbook"><div class="ph">ПАСПОРТ</div><div class="psub">Гражданин «Тихой поездки»</div><label>Имя</label><input id="pn" maxlength="16" placeholder="Как тебя зовут?" autocomplete="off"><label>Подпись</label><div class="sigl"><span id="psg"></span></div><div id="pnote"></div><button class="mb main" id="pb">✍ Подписать паспорт</button></div></div>

<button id="bp">🛂 Протянуть паспорт</button>
<div id="start"><h1>Тихая поездка</h1><div class="sub">Спокойная дорога, радио и кот на заднем сиденье</div>
<div class="mm" id="mMain">

</div>

</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
/* изгиб дороги: сдвигаем мир в сторону пропорционально квадрату расстояния */
const UC={value:0};
THREE.Material.prototype.customProgramCacheKey=function(){return this.userData.nb?'n':'b'};
THREE.Material.prototype.onBeforeCompile=function(s){if(this.userData.nb||!s.vertexShader.includes('#include <project_vertex>'))return;s.uniforms.uCurve=UC;
s.vertexShader='uniform float uCurve;\n'+s.vertexShader.replace('#include <project_vertex>','vec4 wp=modelMatrix*vec4(transformed,1.0);wp.x+=uCurve*wp.z*wp.z;vec4 mvPosition=viewMatrix*wp;gl_Position=projectionMatrix*mvPosition;')};
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));$('stage').prepend(R.domElement);
const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(75,1,.05,1000);C.rotation.order='YXZ';
const HOME=new THREE.Vector3(-.38,1.08,.32);
const por=()=>innerHeight>innerWidth,SW=()=>por()?innerHeight:innerWidth,SH=()=>por()?innerWidth:innerHeight;
function rs(){const q=$('stage').style,p=por();q.width=p?innerHeight+'px':'100%';q.height=p?innerWidth+'px':'100%';q.transform=p?'rotate(90deg) translateY(-100%)':'none';R.setSize(SW(),SH());C.aspect=SW()/SH();C.fov=C.aspect<1.3?85:75;C.updateProjectionMatrix()}
addEventListener('resize',rs);addEventListener('orientationchange',()=>setTimeout(rs,200));rs();
S.fog=new THREE.Fog(0x99ccdd,20,320);
const M=(c,o)=>new THREE.MeshLambertMaterial(Object.assign({color:c},o));
const B=(w,h,d,m,x,y,z,p)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);(p||S).add(o);return o};
const st={wl:0,wr:0,rl:0,rr:0,wp:0,li:0,ra:0};let kmh=0,tn=0,night=0,fa=0,fv=0,wa=0,T=0,dist=0,odo=0,rn=0,rain=0;
var zoneZ=()=>false;const hits=[],A=(o,a)=>{o.userData.act=a;hits.push(o);return o};

/* свет и небо */
const amb=new THREE.HemisphereLight(0xdcecff,0x9a8f80,.75),sun=new THREE.DirectionalLight(0xffffff,.8);sun.position.set(-30,40,-20);S.add(amb,sun);
const dome=new THREE.PointLight(0xffe2b0,0,3.5);dome.position.set(0,1.3,.2);S.add(dome);
const head=new THREE.SpotLight(0xfff2cc,0,60,.5,.5);head.position.set(0,.6,-2.4);head.target.position.set(0,-.3,-30);S.add(head,head.target);
const sky=new THREE.Mesh(new THREE.SphereGeometry(500,16,12),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,uniforms:{t:{value:new THREE.Color()},b:{value:new THREE.Color()}},
vertexShader:'varying float h;void main(){h=normalize(position).y;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
fragmentShader:'uniform vec3 t,b;varying float h;void main(){gl_FragColor=vec4(mix(b,t,smoothstep(0.,.6,h)),1.);}'}));sky.renderOrder=-1;S.add(sky);
const sg=new THREE.BufferGeometry(),sp=[];for(let i=0;i<400;i++){const a=Math.random()*6.28,e=Math.random()*1.4+.05;sp.push(Math.cos(a)*Math.cos(e)*450,Math.sin(e)*450,Math.sin(a)*Math.cos(e)*450)}
sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
const stars=new THREE.Points(sg,new THREE.PointsMaterial({size:2,sizeAttenuation:false,transparent:true,opacity:0,fog:false,depthWrite:false}));S.add(stars);
const orb=new THREE.Mesh(new THREE.SphereGeometry(14,16,12),new THREE.MeshBasicMaterial({fog:false}));orb.position.set(-120,90,-380);S.add(orb);
const glow=new THREE.Mesh(new THREE.SphereGeometry(36,16,12),new THREE.MeshBasicMaterial({color:0xfff1b0,transparent:true,opacity:.22,fog:false,depthWrite:false}));glow.position.copy(orb.position);glow.material.userData.nb=1;S.add(glow);

/* дорога и земля */
function tex(w,h,fn,ry){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(1,ry);t.anisotropy=8;return t}
const rt=tex(256,256,(g,w,h)=>{g.fillStyle='#3a3c40';g.fillRect(0,0,w,h);for(let i=0;i<600;i++){g.fillStyle=`rgba(255,255,255,${Math.random()*.06})`;g.fillRect(Math.random()*w,Math.random()*h,2,2)}
g.fillStyle='#eee';g.fillRect(8,0,6,h);g.fillRect(w-14,0,6,h);g.fillStyle='#e8c33a';g.fillRect(w/2-4,0,8,h*.5)},50);
const road=new THREE.Mesh(new THREE.PlaneGeometry(6.8,400,1,100),new THREE.MeshLambertMaterial({map:rt}));road.rotation.x=-Math.PI/2;road.position.set(-1.7,-.35,-165);S.add(road);
for(const x of[2.4,-5.8]){const sh=new THREE.Mesh(new THREE.PlaneGeometry(1.4,400,1,100),M(0x8d877a));sh.rotation.x=-Math.PI/2;sh.position.set(x,-.37,-165);S.add(sh)}
const gt=tex(64,64,(g,w,h)=>{g.fillStyle='#fff';g.fillRect(0,0,w,h);g.fillStyle='#e2e2e2';g.fillRect(0,0,w,h/2);for(let i=0;i<260;i++){g.fillStyle='rgba(0,0,0,'+Math.random()*.12+')';g.fillRect(Math.random()*w,Math.random()*h,2,2)}},50);
gt.repeat.set(150,50);
const gM=new THREE.MeshLambertMaterial({map:gt}),ground=new THREE.Mesh(new THREE.PlaneGeometry(1200,400,1,50),gM);ground.rotation.x=-Math.PI/2;ground.position.set(0,-.4,-170);S.add(ground);

/* пейзаж */
/* доля города в точке дороги: луга -> окраина -> город -> окраина -> луга */
const CYC=3000,sm3=(a,b,x)=>{x=Math.max(0,Math.min(1,(x-a)/(b-a)));return x*x*(3-2*x)};
const cf=w=>{const p=((w%CYC)+CYC)%CYC;return sm3(500,1100,p)*(1-sm3(2300,2900,p))},cz=z=>cf(dist-z);
const leafM=M(0x2e7d32),trunkM=M(0x5a3d2b),rockM=M(0x8a8c92),wallM=M(0xe8dcc8),roofM=M(0xa0452e),lampM=new THREE.MeshBasicMaterial({color:0x555555});
const birchM=M(0x93c25e),barkM=M(0xe6e4da),bushM=M(0x3f8f3a),hayM=M(0xd6b546),barnM=M(0x9b2f22),trimM=M(0xf1ede4),doorM=M(0x5a3a22),glH=M(0x9ec3dd),stoneM=M(0x8a8478);
const WL=[0xe8dcc8,0xd9c7a0,0xc9d6df,0xe6b8a2].map(c=>M(c)),RF=[0xa0452e,0x5b6b7a,0x7a4a32].map(c=>M(c));
function mk(r){const g=new THREE.Group();
 if(r<.44){const h=2+Math.random()*3.5,q=Math.random();
  if(q<.3){B(.08,h*.8,.08,barkM,0,h*.4,0,g);for(let i=0;i<4;i++){const k=new THREE.Mesh(new THREE.SphereGeometry(h*(.2-i*.02),8,6),birchM);k.position.set((i%2-.5)*h*.12,h*(.45+i*.14),(i-1.5)*h*.05);g.add(k)}}
  else{const t=new THREE.Mesh(new THREE.CylinderGeometry(.12,.18,h*.45,6),trunkM);t.position.y=h*.22;g.add(t);
   if(q<.65){for(let i=0;i<3;i++){const k=new THREE.Mesh(new THREE.ConeGeometry(h*(.34-i*.08),h*.55,8),leafM);k.position.y=h*(.45+i*.3);g.add(k)}}
   else{for(let i=0;i<3;i++){const k=new THREE.Mesh(new THREE.SphereGeometry(h*(.3-i*.03),8,6),leafM);k.position.set((i-1)*h*.14,h*(.62+(i%2)*.18),(i-1)*h*.08);g.add(k)}}}}
 else if(r<.58){const s=.5+Math.random()*.6;for(let i=0;i<4;i++){const k=new THREE.Mesh(new THREE.SphereGeometry(s*(.7+Math.random()*.4),8,6),bushM);k.position.set((Math.random()-.5)*s*2,s*.5,(Math.random()-.5)*s*1.4);g.add(k)}}
 else if(r<.66){const k=new THREE.Mesh(new THREE.DodecahedronGeometry(.5+Math.random()*1.2),rockM);k.position.y=.2;g.add(k)}
 else if(r<.74){const n=1+((Math.random()*3)|0);for(let i=0;i<n;i++){const k=new THREE.Mesh(new THREE.CylinderGeometry(.75,.75,1.3,12),hayM);k.rotation.z=Math.PI/2;k.position.set(i*1.5-(n-1)*.75,.75,(i%2)*.4);g.add(k)}}
 else if(r<.9){const w=4+Math.random()*3,h=2.6+Math.random()*.9;B(w,h,w,WL[(Math.random()*4)|0],0,h/2,0,g);
  const k=new THREE.Mesh(new THREE.ConeGeometry(w*.8,h*.6,4),RF[(Math.random()*3)|0]);k.rotation.y=Math.PI/4;k.position.y=h*1.3;g.add(k);
  B(.9,1.7,.08,doorM,-w*.2,.85,w/2+.02,g);B(.8,.8,.08,glH,w*.22,1.5,w/2+.02,g);B(.08,.8,.8,glH,w/2+.02,1.5,0,g);B(.08,.8,.8,glH,-w/2-.02,1.5,0,g);B(.45,1.4,.45,stoneM,w*.25,h+.9,-w*.15,g)}
 else{const w=7,l=9,h=4;B(w,h,l,barnM,0,h/2,0,g);B(2.6,3,.1,trimM,0,1.5,l/2+.03,g);B(.2,3.1,.12,doorM,0,1.55,l/2+.08,g);
  const rf=new THREE.Mesh(new THREE.CylinderGeometry(w*.6,w*.6,l+.6,3),M(0x5b5f66));rf.rotation.x=-Math.PI/2;rf.scale.z=.45;rf.position.y=h+w*.6*.5*.45;g.add(rf)}
 {const b=new THREE.Box3().setFromObject(g);g.userData.mg=Math.hypot(Math.max(-b.min.x,b.max.x),Math.max(-b.min.z,b.max.z))}
 S.add(g);return g}
function put(o,z){const s=Math.random()<.5?1:-1,r=Math.pow(Math.random(),1.6);const mg=o.userData.mg||1;o.position.set(s>0?3.6+mg+r*70:-7-mg-r*70,-.4,z);o.rotation.y=Math.random()*6.28;o.visible=Math.random()>=cz(z)&&!zoneZ(z)}
const scn=[];for(let i=0;i<110;i++){const o=mk(Math.random());put(o,-Math.random()*300);scn.push(o)}
const lamps=[];for(let i=0;i<12;i++){const g=new THREE.Group(),pm=M(0x666a72);B(.12,5.5,.12,pm,0,2.75,0,g);B(1.3,.1,.2,pm,-.6,5.5,0,g);B(.5,.1,.3,lampM,-1.2,5.4,0,g);g.position.set(2.7,-.4,-i*25);S.add(g);lamps.push(g)}
const railM=M(0xb8bcc4),rails=[];for(let i=0;i<40;i++)for(const x of[2.3,-5.6])rails.push(B(.08,.35,7.6,railM,x,-.05,-i*8));
const signs=[];for(let i=0;i<4;i++){const g=new THREE.Group();B(.1,2.6,.1,M(0x777b83),0,1.3,0,g);B(1.2,.9,.06,M([0x2a62c9,0xd9392b,0xf2c200,0x2f9e5b][i]),0,2.5,0,g);g.position.set(3.4,-.4,-i*80-30);g.rotation.y=.3;S.add(g);signs.push(g)}
const balloons=[];for(let i=0;i<3;i++){const g=new THREE.Group(),s=new THREE.Mesh(new THREE.SphereGeometry(7,12,10),M(new THREE.Color().setHSL(i*.3,.7,.55)));s.scale.y=1.2;g.add(s);B(1.8,1.4,1.8,M(0x8a6a44),0,-10.5,0,g);g.position.set(-90+i*90,45+i*12,-200-i*40);S.add(g);balloons.push(g)}
const mtM=new THREE.MeshBasicMaterial({fog:false,color:0x6f8fa8});
for(let i=0;i<16;i++){const r=60+Math.random()*80,h=50+Math.random()*90,m=new THREE.Mesh(new THREE.ConeGeometry(r,h,6),mtM);m.position.set(-450+i*60+Math.random()*30,h/2-5,-330-Math.random()*60);S.add(m)}
